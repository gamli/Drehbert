[project]
name = "drehbert"
version = "0.1.0"
description = "Controller for the Drehbert photogrammetry turntable"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gpiozero>=2.0.1.post3,<3",
    "lgpio>=0.2.2.0,<0.3; sys_platform == 'linux' and platform_machine == 'armv6l'",
]

[project.scripts]
drehbert = "drehbert.app:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.7,<0.17",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
